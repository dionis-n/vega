name: tests

on:
  push:
    branches: [master, wasm-port]
  pull_request:
  workflow_dispatch:

jobs:
  parser-helpers:
    name: ParserHelpers unit tests (Linux native)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ParserHelpers использует только QString/QList/QRegularExpression.
      # Qt6::Svg в Qt 6.x уже входит в основной пакет qtbase, отдельный modules не нужен.
      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          host: 'linux'
          target: 'desktop'
          cache: true

      - name: Configure CMake
        run: cmake -S src -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      # Собираем только тестовый таргет (без основного Vega-приложения).
      # VegaTests теперь линкует OpenXLSX, чтобы можно было прогонять парсер
      # по реальному .xlsx-расписанию (см. шаг ниже).
      - name: Build VegaTests
        run: cmake --build build --target VegaTests --parallel

      - name: Run tests
        working-directory: build
        run: ctest --output-on-failure

      # Прогон парсера по конкретному .xlsx-расписанию: проверяем разбор
      # приложенного примера и валидируем результат.
      - name: Run parser test against a sample schedule file
        working-directory: build
        run: ./VegaTests --schedule="$GITHUB_WORKSPACE/src/Tests/data/sample_schedule.xlsx"
