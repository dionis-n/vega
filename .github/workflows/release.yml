name: release

# Сборка WebAssembly-версии Vega и публикация готовых файлов
# Vega.html / Vega.js / Vega.wasm как ассетов GitHub Release.
# Запускается при пуше тега вида v1.2.3.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # нужно для создания релиза и загрузки ассетов

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host Qt (build tools)
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.0'
          host: 'linux'
          target: 'desktop'
          arch: 'linux_gcc_64'
          cache: true

      - name: Remember host Qt path
        run: echo "QT_HOST_PATH=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Install Qt for WebAssembly
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.0'
          host: 'all_os'
          target: 'wasm'
          arch: 'wasm_singlethread'
          cache: true

      - name: Remember WebAssembly Qt path
        run: echo "QT_WASM_ROOT=$QT_ROOT_DIR" >> "$GITHUB_ENV"

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 4.0.7

      - name: Configure (WASM, Release)
        run: |
          cmake -S src -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$QT_WASM_ROOT/lib/cmake/Qt6/qt.toolchain.cmake" \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build Vega
        run: cmake --build build --target Vega --parallel

      - name: Publish GitHub Release with build files
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Vega.html
            build/Vega.js
            build/Vega.wasm
